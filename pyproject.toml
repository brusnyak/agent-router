[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-router"
version = "0.1.0"
description = "Control plane for AI coding agents: dispatch, task contracts, pluggable memory and retrieval, one rules source for every harness."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yegor Brusnyak" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn==0.32.0",
  "pydantic==2.9.2",
  "pyyaml==6.0.1",
  "mcp>=1.0",
  "langgraph==1.2.20",
  "langgraph-checkpoint-sqlite==3.1.3",
  "python-multipart==0.0.9",
]

[project.scripts]
backbone = "backbone.cli:main"

[tool.setuptools.packages.find]
include = ["backbone*"]
