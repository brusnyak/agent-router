name: CI

on:
  push:
    branches: [main, dev/backbone]
  pull_request:
    branches: [main, dev/backbone]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run discovery
        run: |
          python scripts/discover_machine.py

      - name: Run configurator
        run: |
          python scripts/configure_from_discovery.py

      - name: Run indexer
        run: |
          python scripts/index_vault.py

      - name: Run tests
        run: |
          python -m pytest tests/ -v

      - name: Run config drift
        run: |
          python scripts/config_drift.py || true
