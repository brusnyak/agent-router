name: nim-smoke
description: NIM via OmniRoute through Pi writes slugify.py; a bash test decides when it is done.
provider: pi
model: omni/nvidia/nvidia/nemotron-3.5-super-vl-120b-a12b
nodes:
  - id: build
    loop:
      prompt: "Create slugify.py in the current directory with a function slugify(text) that lowercases, replaces runs of non-alphanumerics with a single hyphen and strips leading/trailing hyphens. Write the file with your tools; do not just print code."
      until_bash: "python3 -c \"from slugify import slugify; assert slugify(' Hello, World!! ')=='hello-world'; assert slugify('A--B')=='a-b'\""
      max_iterations: 3
      fresh_context: true
