version: 1
projects:
  - id: agent-router
    path: ~/Developer/agent-router
    name: Agent Router
    keywords: [router, backbone, omp, retrieval, harness, orchestration, worker, workers, contract, delegation]
    type: build
    default_agent: codex
    default_model: gpt-6.1-sol
    context_files:
      - AGENTS.md
      - CLAUDE.md
    preferred_lanes:
      - build
      - review-roast

  - id: orca
    path: ~/Library/Application Support/orca
    name: Orca IDE
    type: ops
    default_agent: claude
    default_model: claude-sonnet-5-5
    context_files:
      - AGENTS.md

  - id: hermes-ui
    path: ~/hermes-ui
    name: Hermes UI
    type: ops
    default_agent: claude
    default_model: claude-sonnet-5-5
    context_files: []

  - id: vault
    path: ~/vault
    name: Memory Vault
    type: research
    default_agent: claude
    default_model: claude-sonnet-5-5
    context_files:
      - CLAUDE.md

  - id: trader
    path: ~/Documents/Acore/Development/trader/dexscreener-bot
    name: Trading Engine
    type: research
    default_agent: nim3
    default_model: nemotron-3.5-super-vl-120b-a12b
    context_files:
      - CLAUDE.md
    preferred_lanes:
      - research-public
      - mechanical

  - id: business
    path: ~/vault
    name: Business (master plan, leads, outreach)
    keywords: [plan, master, vision, leads, lead, outreach, offer, pilot, cv, jobs, career, clients, sales, business, copy, polsia]
    type: ops
    default_agent: claude
    default_model: claude-sonnet-5-5
    anchors:
      - pages/START.md
      - pages/plans/2026-11-16-master-plan.md
      - pages/vision.md
      - ~/ai-context/rules/standing-approvals.md

  - id: domovyk
    path: ~/Developer/domovyk
    name: Domovyk (hosting exit planner)
    keywords: [domovyk, aws, hosting, migration, exit, cloud, hetzner, ovhcloud]
    type: build
    default_agent: codex
    default_model: gpt-6.1-sol
    context_files:
      - README.md
    anchors:
      - README.md
      - PROGRESS.md
      - docs/SPEC.md
    preferred_lanes:
      - build
      - review-roast

  - id: global
    path: ~
    name: Global (Orca workspace)
    type: general
    default_agent: claude
    default_model: claude-sonnet-5-5
    context_files:
      - AGENTS.md
    preferred_lanes:
      - ops-repair
      - config-edit
      - cash-leads
      - cash-outreach
      - upwork
      - jobs
