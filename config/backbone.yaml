db: ~/.agent-router/data/backbone.db
tickets_dir: ~/.agent-router/data/tickets
runs_dir: ~/.agent-router/data/runs
graph_db: ~/.agent-router/data/graph.db
work_dir: ~/.agent-router/data/work
projects_file: ~/.agent-router/projects.yaml

nim:
  base_url: https://integrate.api.nvidia.com/v1
  model: nvidia/nemotron-3.5-super-vl-120b-a12b
  keys: [NIM_1, NIM_2, NIM_3, NIM_4, NIM_5]
  default_key: NIM_1
  embed_model: nvidia/nemotron-3.5-embed-1b
  rpm_limit: 40
  max_concurrent_per_key: 2
  retries: 1
  backoff_s: 3
  cooldown_s: 20
  wait_s: 120

swarm:
  max_workers: 8

monitor:
  load_per_cpu: 0.9
  mem_avail_mb: 800
  disk_root_pct: 90
  swap_used_mb: 1500

workers:
  pi:     {cmd: pi, timeout_s: 600}
  goose: {cmd: goose, timeout_s: 600}
  jcode:  {cmd: jcode, timeout_s: 600}
  claude: {cmd: claude, timeout_s: 900}
  codex:  {cmd: codex, timeout_s: 900}
  opencode: {cmd: opencode, timeout_s: 600}
  omp:    {cmd: omp, timeout_s: 600, profile: router, model: nvidia/nvidia/nemotron-3.5-super-vl-120b-a12b}
  agy:    {cmd: agy, timeout_s: 300}
  cline:  {cmd: cline, timeout_s: 900}
escalation:
  expert: codex

# Hermes is the primary reasoning agent on Oracle; it delegates tasks to the backbone router
# via `backbone serve` /submit. Hermes does not run on the Mac.
hermes:
  enabled: true
  base_url: http://127.0.0.1:3033
  delegate_to_backbone: true
  backbone_serve_url: http://127.0.0.1:8799
  backbone_token_env: BACKBONE_TOKEN
context:
  budget_tokens: 24000
  summarize_over_tokens: 12000
  keep_recent_turns: 6
  vault_query: ${VAULT_QUERY_PATH:-~/memory-vault/scripts/vector_memory/query.py}

library:
  sources:
    - {path: backbone/commands, kind: command}
    - {path: ~/.claude/skills, kind: skill}

gates:
  pytest: python3 -m pytest -q
  compile: python3 -m compileall -q .
  noop: 'true'

allowed_roots: []
style:
  default: caveman
  texts:
    caveman: Terse. Result first. No openers, no recaps, no pleasantries.
    ponytail: "Laziest solution that works: standard library first, fewest lines."
    none: ''

openrouter:
  default_model: nvidia/nemotron-3-ultra-550b-a55b:free

hooks:
  pre_run: []
  post_run: []

rerank: false

watch:
  repos: []
  every_s: 21600

decide:
  allow_experts: false

inject:
  max_bodies: 1
  min_score: 0.028
  max_chars: 1500

tiers:
  classify: nim1
  code_edit: nim2
  multi_file: codex
  review: claude
  research: nim3
  draft: or
  plan: claude
  browse: browser
  other: nim1

exclude_refs:
- skill-router
- gather
- router

hosts: {}
delegate:
  heavy: false  # opt-in: route heavy tasks to bounded subagents (backbone delegate) via enforce hook
  max_subagents: 3

night:
  window_start: 23   # 23:00 Europe/Bratislava
  window_end: 7      # 07:00 Europe/Bratislava (overnight window wraps midnight)
  interval_s: 300
  min_interval_s: 120
  max_interval_s: 900
  read_only: true    # night mode never sends, spends, deploys or publishes
  gate: ""
  worker: ""         # router picks per task (tier policy); empty = bandit decision
  project: ""        # empty = current dir / registered project
  pause_files:
    - ~/.agent-router/PAUSE
    - ~/memory-vault/pages/dispatch-PAUSE
