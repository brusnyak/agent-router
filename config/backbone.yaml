db: ~/.agent-router/data/backbone.db
tickets_dir: ~/.agent-router/data/tickets
runs_dir: ~/.agent-router/data/runs
graph_db: ~/.agent-router/data/graph.db
work_dir: ~/.agent-router/data/work
projects_file: /home/ubuntu/.agent-router/projects.yaml

nim:
  base_url: https://integrate.api.nvidia.com/v1
  model: nvidia/nemotron-3.5-super-vl-120b-a12b
  keys: [NIM_1, NIM_2, NIM_3]
  default_key: NIM_1
  embed_model: nvidia/nemotron-3.5-embed-1b
  rpm_limit: 30
  max_concurrent_per_key: 2
  retries: 1
  backoff_s: 3
  cooldown_s: 20
  wait_s: 120

swarm:
  max_workers: 8

workers:
  pi:     {cmd: pi, timeout_s: 600}
  goose:  {cmd: /home/ubuntu/bin/goose, timeout_s: 600}
  jcode:  {cmd: jcode, timeout_s: 600}
  claude: {cmd: claude, timeout_s: 900}
  codex:  {cmd: codex, timeout_s: 900}
  opencode: {cmd: opencode, timeout_s: 600}
  agy:    {cmd: agy, timeout_s: 300}

escalation:
  expert: codex

context:
  budget_tokens: 24000
  summarize_over_tokens: 12000
  keep_recent_turns: 6
  vault_query: ~/memory-vault/scripts/vector_memory/query.py

library:
  sources:
    - {path: backbone/commands, kind: command}
    - {path: ~/.claude/skills, kind: skill}

gates:
  pytest: python3 -m pytest -q
  compile: python3 -m compileall -q .
  noop: 'true'

allowed_roots: []
style:
  default: caveman
  texts:
    caveman: Terse. Result first. No openers, no recaps, no pleasantries.
    ponytail: Laziest solution that works: standard library first, fewest lines.
    none: ''

openrouter:
  default_model: nvidia/nemotron-3-ultra-550b-a55b:free

hooks:
  pre_run: []
  post_run: []

rerank: false

watch:
  repos: []
  every_s: 21600

decide:
  allow_experts: false

inject:
  max_bodies: 1
  min_score: 0.028
  max_chars: 1500

tiers:
  classify: nim1
  code_edit: nim2
  multi_file: codex
  review: claude
  research: nim3
  draft: or
  plan: claude
  browse: browser
  other: nim1

exclude_refs:
- skill-router
- gather
- router

hosts:
  oracle-vm:
    ssh: oracle-vm
    dir: ~/agent-router
    env: ~/.config/agent-router/env
    pythonpath: ~/.agent-router/venv/lib/python3.12/site-packages:~/agent-router/.deps
